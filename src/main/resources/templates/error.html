<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo != null ? titulo + ' | Compilando' : 'Erro | Compilando'}">
        Erro | Compilando
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/organizador.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>

<body>

    <main class="container py-4 py-lg-5">
        <div class="error-page">

            <section class="card error-card shadow-sm">
                <div class="card-body p-4 p-md-5 text-center">

                    <!-- Ícone do erro -->
                    <div class="error-icon mb-4" th:style="${codigo == 403}
                            ? '--error-bg: #fff3cd; --error-color: #856404'
                            : (${codigo == 500}
                                ? '--error-bg: #f8d7da; --error-color: #b02a37'
                                : '--error-bg: #e7f1ff; --error-color: #0d6efd')">

                        <i class="bi fs-1" th:classappend="${icone != null
                                ? icone
                                : (codigo == 403
                                    ? ' bi-shield-lock'
                                    : (codigo == 500
                                        ? ' bi-exclamation-triangle'
                                        : ' bi-search'))}">
                        </i>
                    </div>

                    <!-- Código HTTP -->
                    <div class="error-code fw-bold mb-3" th:text="${codigo != null ? codigo : 500}">
                        404
                    </div>

                    <!-- Título -->
                    <h1 class="h3 fw-bold mb-3" th:text="${titulo != null
                            ? titulo
                            : 'Não foi possível concluir sua solicitação'}">
                        Recurso não encontrado
                    </h1>

                    <!-- Descrição -->
                    <p class="text-secondary error-description mb-4" th:text="${mensagem != null
                            ? mensagem
                            : 'Ocorreu um problema ao processar sua solicitação. Tente novamente.'}">
                        O recurso solicitado não foi encontrado.
                    </p>

                    <!-- Referência opcional para suporte -->
                    <div class="alert alert-light border text-start small mb-4" th:if="${referencia != null}">
                        <div class="fw-semibold mb-1">
                            <i class="bi bi-info-circle me-2 text-primary"></i>
                            Informações adicionais
                        </div>

                        <div class="text-secondary">
                            Referência:
                            <span class="error-reference" th:text="${referencia}">ERR-001</span>
                        </div>
                    </div>

                    <!-- Ações -->
                    <div class="error-actions">
                        <a th:href="${urlRetorno != null ? urlRetorno : (urlUsuario == 'organizador'
                            ? '/organizador/desafios'
                            : (urlUsuario == 'equipe' ? '/equipe' : '/entrar'))}" class="btn btn-primary">
                            <i class="bi bi-house-door me-2"></i>
                            Ir para a página inicial
                        </a>

                        <button type="button" class="btn btn-outline-secondary" th:attr="data-destino=${urlRetorno != null
                            ? urlRetorno
                            : (urlUsuario == 'organizador'
                            ? '/organizador'
                            : (urlUsuario == 'equipe' ? '/equipe' : '/entrar'))}" onclick="voltarPagina(this)">
                            <i class="bi bi-arrow-left me-2"></i>
                            Voltar à página inicial
                        </button>
                    </div>

                    <hr class="my-4">

                    <p class="text-secondary small mb-0">
                        <i class="bi bi-code-slash me-1"></i>
                        Compilando — Ambiente de desafios computacionais
                    </p>

                </div>
            </section>

        </div>
    </main>

    <script>
    function voltarPagina(botao) {
        const destino = botao.dataset.destino;
        window.location.replace(destino || '/entrar');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
