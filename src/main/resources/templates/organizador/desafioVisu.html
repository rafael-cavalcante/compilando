<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalhes do Desafio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/organizador.css}">
    <link rel="stylesheet" th:href="@{/css/desafioForm.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar('desafios')}"></div>

    <!-- Navbar opcional -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Visualizar Desafio</h4>
                        <span class="badge text-bg-light" th:text="${desafio.status}">STATUS</span>
                    </div>

                    <div class="card-body">

                        <!-- Título -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título:</label>
                            <p class="form-control-plaintext border-bottom pb-2" th:text="${desafio.titulo}">Título do
                                Desafio</p>
                        </div>

                        <!-- Descrição -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descrição:</label>
                            <p class="form-control-plaintext border-bottom pb-2" th:text="${desafio.descricao}">
                                Descrição detalhada do desafio...</p>
                        </div>

                        <!-- Nível -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nível:</label>
                            <p class="form-control-plaintext border-bottom pb-2" th:text="${desafio.nivel}">FÁCIL</p>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Data de Início:</label>
                                <!-- Se for LocalDate/LocalDateTime, usamos #temporals.format -->
                                <p class="form-control-plaintext border-bottom pb-2" 
                                   th:text="${desafio.dataInicio != null ? #temporals.format(desafio.dataInicio, 'dd/MM/yyyy') : 'Não definida'}">
                                   01/01/2026
                                </p>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Data de Término:</label>
                                <p class="form-control-plaintext border-bottom pb-2" 
                                   th:text="${desafio.dataFim != null ? #temporals.format(desafio.dataFim, 'dd/MM/yyyy') : 'Não definida'}">
                                   31/12/2026
                                </p>
                            </div>
                        </div>

                        <!-- Botões de Ação -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/desafios" class="btn btn-secondary">Voltar</a>

                            <!-- Exemplo caso queira colocar um botão para editar -->
                            <a th:href="@{/desafios/editar/{id}(id=${desafio.id})}" class="btn btn-warning">Editar
                                Desafio</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
