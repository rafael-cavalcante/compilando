<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compilando - Painel da Equipe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/equipe}">
                Compilando
            </a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light" type="submit">
                    Sair
                </button>
            </form>
        </div>
    </nav>

    <main class="container py-5">
        <h1>Área da Equipe</h1>
        <p>Bem-vindo ao painel da sua equipe!</p>

        <div class="row g-4" th:if="${!#lists.isEmpty(desafios)}">

            <div class="col-md-6 col-xl-4" th:each="desafio : ${desafios}">

                <article class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex flex-column">

                        <div class="d-flex justify-content-between
                                align-items-start gap-2 mb-3">
                            <span class="badge text-bg-info" th:text="${desafio.nivel}">
                                INICIANTE
                            </span>

                            <span class="badge text-bg-success" th:text="${desafio.status.name}"></span>
                        </div>

                        <h2 class="h5 fw-bold" th:text="${desafio.titulo}">
                            Título do desafio
                        </h2>

                        <p class="text-secondary" th:text="${desafio.descricao}">
                            Descrição do desafio
                        </p>

                        <div class="d-flex flex-wrap gap-3
                                text-secondary small mb-3">
                            <span>
                                <i class="bi bi-list-ol"></i>
                                <!--<span th:text="${desafio.questoes.size()}">0</span>-->
                                questões
                            </span>

                            <span>
                                <i class="bi bi-trophy"></i>
                                <!--<span th:text="${desafio.pontuacao}">100</span>-->
                                pontos
                            </span>
                        </div>

                        <div class="mt-auto d-flex flex-wrap gap-2">
                            <a class="btn btn-primary btn-sm"
                                th:href="@{/equipe/desafios/{id}/questoes(id=${desafio.id})}">
                                <i class="bi bi-list-check"></i>
                                Questões
                            </a>
                        </div>

                    </div>
                </article>
            </div>
        </div>
    </main>

</body>

</html>
